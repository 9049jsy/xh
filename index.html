<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#e9e7ed"><title>승민의 iPhone · OFF STAGE</title><link rel="stylesheet" href="./style.css?v=6"></head><body><main class="stage"><aside class="intro"><div class="eyebrow">OFF STAGE / ON MY PHONE</div><h1>무대 밖,<br>승민의 하루<span>✳</span></h1><p class="lead">사진은 아직 고르는 중.<br>가고 싶은 곳은 아직 많은 중.</p><div class="intro-rule"></div><p class="guide">정해진 순서는 없어요.<br>앱을 열고, 남겨진 하루를 구경해 보세요.<br>가끔은 전화가 올지도 몰라요.</p><button id="reset" class="reset-link">↺ 처음부터 구경하기</button><small>팬이 상상한 가상의 휴대폰입니다.<br>대화·게시물·일정은 실제 기록이 아닙니다.</small></aside><section class="phone" aria-label="승민의 가상 아이폰"><div class="screen"><header class="status"><span>13:42</span><div class="island"></div><span class="signal">▮▮▮  ᴡɪғɪ ▰</span></header><div id="view"></div><button id="notification" hidden></button><div id="call-overlay" hidden></div><div id="toast" role="status"></div><button id="home" class="homebar" aria-label="홈 화면으로"></button></div></section><aside class="margin-note"><span>SEUNGMIN’S IPHONE</span><p>찍고, 고르고.<br>듣고, 찾아보고.<br>그런 하루.</p><small id="explore-count">자유롭게 구경해 보세요</small></aside></main><dialog id="reset-dialog"><h2>처음부터 구경할까요?</h2><p>메시지, 체크리스트와 통화 이벤트가 초기화돼요.</p><div><button id="cancel-reset">계속 구경하기</button><button id="confirm-reset">초기화</button></div></dialog><script src="./details.js?v=6"></script><script src="./app.js?v=6"></script></body></html>
