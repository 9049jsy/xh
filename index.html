<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#e9e7ed"><title>승민의 iPhone · OFF STAGE</title><link rel="stylesheet" href="./style.css?v=9"></head><body><main class="stage"><aside class="intro"><div class="eyebrow">OFF STAGE / ON MY PHONE</div><h1>무대 밖,<br>승민의 하루<span>✳</span></h1><p class="lead">사진은 아직 고르는 중.<br>가고 싶은 곳은 아직 많은 중.</p><div class="intro-rule"></div><p class="guide">정해진 순서는 없어요.<br>앱을 열고, 남겨진 하루를 구경해 보세요.<br>가끔은 전화가 올지도 몰라요.</p><button id="reset" class="reset-link">↺ 처음부터 구경하기</button><small>팬이 상상한 가상의 휴대폰입니다.<br>대화·게시물·일정은 실제 기록이 아닙니다.</small></aside><section class="phone" aria-label="승민의 가상 아이폰"><div class="screen"><header class="status"><span>13:42</span><div class="island"></div><span class="signal" aria-label="셀룰러 신호, Wi-Fi, 배터리"><svg viewBox="0 0 20 14" fill="currentColor" aria-hidden="true"><rect x="1" y="9" width="3" height="4" rx=".8"/><rect x="6" y="6" width="3" height="7" rx=".8"/><rect x="11" y="3" width="3" height="10" rx=".8"/><rect x="16" y="0" width="3" height="13" rx=".8"/></svg><svg viewBox="0 0 20 15" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M1 4a15 15 0 0 1 18 0M4 8a10 10 0 0 1 12 0M7 11a5 5 0 0 1 6 0"/><circle cx="10" cy="14" r="1" fill="currentColor" stroke="none"/></svg><span class="battery"><i></i></span></span></header><div id="view"></div><button id="notification" hidden></button><div id="call-overlay" hidden></div><div id="toast" role="status"></div><button id="home" class="homebar" aria-label="홈 화면으로"></button></div></section><aside class="margin-note"><span>SEUNGMIN’S IPHONE</span><p>찍고, 고르고.<br>듣고, 찾아보고.<br>그런 하루.</p><small id="explore-count">자유롭게 구경해 보세요</small></aside></main><dialog id="reset-dialog"><h2>처음부터 구경할까요?</h2><p>메시지, 체크리스트와 통화 이벤트가 초기화돼요.</p><div><button id="cancel-reset">계속 구경하기</button><button id="confirm-reset">초기화</button></div></dialog><script src="./details.js?v=9"></script><script src="./app.js?v=9"></script></body></html>
