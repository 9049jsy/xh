<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#172726"><title>아직, 보내지 못한 말 · 정수의 iPhone</title><link rel="stylesheet" href="./style.css?v=2"></head><body><main class="stage"><aside class="intro"><div class="eyebrow">AN INTERACTIVE PHONE STORY</div><h1>아직,<br>보내지 못한 말<span>.</span></h1><p>끝내려던 건 아니었다.<br>그냥, 붙잡아 주길 바랐을 뿐.</p><div class="intro-line"></div><p class="guide">김정수의 휴대폰입니다.<br>기록을 들여다보고, 입력창에 담긴 말을 전송해 보세요.<br>당신이 누른 전송에서 이야기가 시작됩니다.</p><button class="restart" id="reset">↺ 처음부터 다시 보기</button><small>등장인물과 사건은 가상의 설정입니다.</small></aside><section class="phone" aria-label="김정수의 아이폰"><div class="screen"><div class="status"><span id="clock">21:07</span><div class="island"></div><span class="signals">▮▮▮  ᴡɪғɪ  ▰</span></div><div id="view"></div><button id="notification" class="notification" hidden></button><div id="toast" role="status"></div><button class="homebar" id="home" aria-label="홈 화면으로"></button></div></section><aside class="side-note"><span>01 / JEONGSU</span><p>어떤 말은<br>보내고 나서야<br>무게를 알게 된다.</p><div id="chapter">헤어지기 전, 어느 저녁</div></aside></main><dialog id="reset-dialog"><h2>처음부터 다시 볼까요?</h2><p>이 휴대폰에 저장된 체험 진행이 초기화됩니다.</p><div><button id="cancel-reset">이어 하기</button><button id="confirm-reset">처음부터</button></div></dialog><script src="./app.js?v=2"></script></body></html>
